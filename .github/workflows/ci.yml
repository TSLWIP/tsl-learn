name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc
      - run: npm test
      # The e2e fixture server replaces the sign list and clips, so CI does not need the (non-public) clip library.
      - run: npx vite build
      - run: npx playwright install --with-deps chromium chrome
      - run: npx playwright test

  # Deploy is wired up in Milestone 6 (needs the content-source decision and permission to host clips).
